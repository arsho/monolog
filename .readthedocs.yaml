#
# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# PDF is deliberately not built. The docs contain relational-algebra and
# typographic characters (join, set-difference, union, not-equal, accented
# names) that Sphinx's default pdflatex engine cannot encode without extra
# font configuration. EPUB is pure XML and renders them without special setup.
formats:
  - epub

python:
  install:
    - requirements: docs/requirements.txt
